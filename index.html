<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moto Shop - Loja de Motos Premium</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="description" content="Moto Shop - Compre motos premium, acessórios e viva a liberdade!">
    <meta name="keywords" content="motos, loja de motos, motocicletas, acessórios">
</head>
<body>
    <!-- Cabeçalho -->
    <header>
        <div class="logo">
            <h1>Moto Shop</h1>
        </div>
        <nav>
            <ul>
                <li><a href="#home">Início</a></li>
                <li><a href="#shop">Loja</a></li>
                <li><a href="#cart">Carrinho (<span id="cart-count">0</span>)</a></li>
                <li><a href="#contact">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!-- Seção Principal -->
    <section id="home" class="hero">
        <div class="hero-content">
            <h2>Conquiste a Estrada</h2>
            <p>As melhores motos para sua aventura estão aqui!</p>
            <a href="#shop" class="btn">Comprar Agora</a>
        </div>
    </section>

    <!-- Seção Loja -->
    <section id="shop" class="shop">
        <h2>Nossas Motos</h2>
        <div class="filters">
            <label for="type-filter">Filtrar por Tipo:</label>
            <select id="type-filter">
                <option value="all">Todas</option>
                <option value="esportiva">Esportiva</option>
                <option value="custom">Custom</option>
                <option value="off-road">Off-Road</option>
            </select>
            <label for="price-filter">Ordenar por Preço:</label>
            <select id="price-filter">
                <option value="default">Padrão</option>
                <option value="low-to-high">Menor para Maior</option>
                <option value="high-to-low">Maior para Menor</option>
            </select>
        </div>
        <div id="moto-gallery" class="moto-gallery"></div>
    </section>

    <!-- Carrinho -->
    <section id="cart" class="cart">
        <h2>Seu Carrinho</h2>
        <div id="cart-items"></div>
        <div class="cart-total">
            <h3>Total: R$ <span id="cart-total">0,00</span></h3>
            <button id="checkout-btn" class="btn">Finalizar Compra</button>
        </div>
    </section>

    <!-- Contato -->
    <section id="contact" class="contact">
        <h2>Entre em Contato</h2>
        <form id="contact-form">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" required></textarea>
            </div>
            <button type="submit" class="btn">Enviar</button>
        </form>
    </section>

    <!-- Rodapé -->
    <footer>
        <p>© 2025 Moto Shop. Todos os direitos reservados.</p>
        <div class="social-links">
            <a href="#">Facebook</a>
            <a href="#">Instagram</a>
            <a href="#">YouTube</a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
